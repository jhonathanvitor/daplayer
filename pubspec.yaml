name: daplayer
description: "DaPlayer - Player de Coletâneas e Músicas do YouTube com Suporte a Bandeja"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter

  # Player de Áudio
  just_audio: ^0.9.40
  audio_video_progress_bar: ^2.0.3

  # YouTube Audio Stream Extractor
  youtube_explode_dart: ^2.2.3

  # Desktop Window & Tray Management
  system_tray: ^2.0.3
  window_manager: ^0.4.3

  # Banco de Dados SQLite & Criptografia
  sqflite: ^2.4.1
  sqflite_common_ffi: ^2.3.4+4
  sqlite3: ^2.9.4
  encrypt: ^5.0.3
  crypto: ^3.0.8
  path: ^1.9.0
  path_provider: ^2.1.5

  # Gerenciamento de Estado & Dados
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  cached_network_image: ^3.3.1
  intl: ^0.19.0
  cupertino_icons: ^1.0.8
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  path_provider_platform_interface: ^2.1.2
  plugin_platform_interface: ^2.1.8

flutter:
  uses-material-design: true

  assets:
    - assets/
