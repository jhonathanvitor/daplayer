name: daplayer
description: "DaPlayer - Player de Coletâneas e Músicas do YouTube com Suporte a Bandeja"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter

  # Player de Áudio
  just_audio: ^0.9.40
  audio_video_progress_bar: ^2.0.3

  # YouTube Audio Stream Extractor
  youtube_explode_dart: ^3.1.0

  # Desktop Window & Tray Management
  system_tray: ^2.0.3
  window_manager: ^0.4.3

  # Banco de Dados SQLite & Criptografia
  sqflite: ^2.4.1
  sqflite_common_ffi: ^2.3.4+4
  sqlite3: ^2.9.4
  encrypt: ^5.0.3
  crypto: ^3.0.8
  path: ^1.9.0
  path_provider: ^2.1.5

  # Gerenciamento de Estado & Dados
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  cached_network_image: ^3.3.1
  intl: ^0.19.0
  cupertino_icons: ^1.0.8
  url_launcher: ^6.3.2
  screen_retriever: ^0.2.2
  http: ^1.6.0
  ffi: ^2.1.3
  audio_service: ^0.18.19

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  path_provider_platform_interface: ^2.1.2
  plugin_platform_interface: ^2.1.8
  flutter_launcher_icons: ^0.14.4

dependency_overrides:
  path: 1.9.0

flutter_launcher_icons:
  android: true
  image_path: "assets/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0F0F1A"
  adaptive_icon_foreground: "assets/icon_foreground.png"

flutter:
  uses-material-design: true

  assets:
    - assets/
