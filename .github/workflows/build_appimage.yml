name: Build & Release DaPlayer (Linux & Android APK)

on:
  push:
    branches: [ main ]
    tags:
      - 'daplayer*'
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
          cache: true

      - name: Install Linux Build Dependencies & Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libayatana-appindicator3-dev rpm ruby-dev build-essential
          sudo gem install --no-document fpm

      - name: Install Pub Dependencies
        run: flutter pub get

      - name: Build Android APK
        run: |
          flutter build apk --release
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/DaPlayer.apk

      - name: Build All Linux Packages & Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x scripts/*.sh
          ./scripts/build_and_release.sh

      - name: Upload Artifacts to Workflow
        uses: actions/upload-artifact@v4
        with:
          name: DaPlayer-Packages
          path: |
            dist/DaPlayer.apk
            dist/DaPlayer-x86_64.AppImage
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
