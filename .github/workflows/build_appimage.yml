name: Build DaPlayer AppImage

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
          cache: true

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libayatana-appindicator3-dev

      - name: Install Pub Dependencies
        run: flutter pub get

      - name: Run Tests
        run: flutter test

      - name: Build AppImage
        run: ./scripts/build_appimage.sh

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DaPlayer-Linux-AppImage
          path: dist/DaPlayer-x86_64.AppImage
